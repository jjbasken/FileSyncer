[workspace]
resolver = "3"
members = ["crates/filesyncer-core", "crates/filesyncer-cli", "crates/filesyncer-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"

# Dependencies are built optimized even in dev builds: unoptimized BLAKE3
# hashes about 20x slower, which turns `cargo run` on a large tree into hours.
[profile.dev.package."*"]
opt-level = 3
